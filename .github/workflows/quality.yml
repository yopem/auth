name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run lint
        run: vp run lint

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Check format
        run: vp run format:check

  test:
    name: D1 and Worker Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Check migrations
        run: vp run db:check

      - name: Run tests
        run:
          vp test --reporter=default --reporter=json
          --outputFile=/tmp/yopem-auth-tests.json

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yopem-auth-tests
          path: /tmp/yopem-auth-tests.json

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Run typecheck
        run: vp run typecheck
