[fmt]
bracketSpacing = true
jsxSingleQuote = false
printWidth = 80
proseWrap = "always"
semi = false
singleQuote = false
tabWidth = 2
trailingComma = "all"
sortPackageJson = true
ignorePatterns = [
  "**/node_modules",
  "**/.pnp",
  "**/.pnp.js",
  "**/.env",
  "**/.env.local",
  "**/.env.development.local",
  "**/.env.test.local",
  "**/.env.production.local",
  "**/coverage",
  "**/.turbo",
  "**/.vercel",
  "**/.next/",
  "**/out/",
  "**/build",
  "**/dist",
  "**/npm-debug.log*",
  "**/yarn-debug.log*",
  "**/yarn-error.log*",
  "**/.DS_Store",
  "**/*.pem",
  "**/tsconfig.tsbuildinfo",
  "**/*.tsbuildinfo",
  "**/next-env.d.ts",
  "**/.opencode/",
  "**/openspec/",
  "**/opencode.jsonc",
  "**/AGENTS.md",
  "**/skills",
  "**/.gemini",
  "**/migrations/",
  "**/*.config.*",
]

[fmt.sortImports]
newlinesBetween = true
groups = [
  "type-import",
  ["value-builtin", "value-external"],
  "type-internal",
  "value-internal",
  ["type-parent", "type-sibling", "type-index"],
  ["value-parent", "value-sibling", "value-index"],
  "unknown",
]

[lint]
# Keep the shared Yopem rule semantics in Bun's native engine.
flavor = "oxlint"
plugins = [
  "import",
  "promise",
  "eslint-plugin-oxfmt",
  { "name" = "quality", "specifier" = "@yopem/eslint-plugin/quality" },
  { "name" = "react-policy", "specifier" = "@yopem/eslint-plugin/react-policy" },
  { "name" = "stylistic", "specifier" = "@yopem/eslint-plugin/stylistic" },
]
typeAware = true
typeCheck = true
ignorePatterns = [
  "**/node_modules",
  "**/.pnp",
  "**/.pnp.js",
  "**/.env",
  "**/.env.local",
  "**/.env.development.local",
  "**/.env.test.local",
  "**/.env.production.local",
  "**/coverage",
  "**/.turbo",
  "**/.vercel",
  "**/.next/",
  "**/out/",
  "**/build",
  "**/dist",
  "**/npm-debug.log*",
  "**/yarn-debug.log*",
  "**/yarn-error.log*",
  "**/.DS_Store",
  "**/*.pem",
  "**/tsconfig.tsbuildinfo",
  "**/*.tsbuildinfo",
  "**/next-env.d.ts",
  "**/.opencode/",
  "**/openspec/",
  "**/opencode.jsonc",
  "**/AGENTS.md",
  "**/skills",
  "**/.gemini",
  "**/migrations/",
  "**/*.config.*",
]

[lint.categories]
"correctness" = "error"

[lint.rules]
"yopem-ui/prefer-layout-primitives" = "error"
"yopem-ui/no-restyle" = "error"
"yopem-ui/enforce-styling-methods" = "error"
"yopem-ui/static-stylex" = "error"
"yopem-ui/no-raw-stylex-colors" = "error"
"effect/no-manual-effect-error-tag" = "error"
"effect/no-manual-tag-comparison" = "error"
"effect/no-manual-tagged-construction" = "error"
"effect/no-service-constructor-imports" = "error"
"effect/prefer-effect-match" = "error"
"func-style" = ["error", "declaration", { "allowArrowFunctions" = true }]
"import/no-relative-parent-imports" = "error"
"no-array-constructor" = "error"
"no-async-promise-executor" = "error"
"no-case-declarations" = "error"
"no-compare-neg-zero" = "error"
"no-cond-assign" = "error"
"no-console" = ["error", { "allow" = ["error", "warn", "info"] }]
"no-constant-binary-expression" = "error"
"no-constant-condition" = "error"
"no-control-regex" = "error"
"no-debugger" = "error"
"no-delete-var" = "error"
"no-dupe-else-if" = "error"
"no-duplicate-case" = "error"
"no-empty" = "error"
"no-empty-character-class" = "error"
"no-empty-function" = "error"
"no-empty-pattern" = "error"
"no-empty-static-block" = "error"
"no-ex-assign" = "error"
"no-extra-boolean-cast" = "error"
"no-fallthrough" = "error"
"no-global-assign" = "error"
"no-invalid-regexp" = "error"
"no-irregular-whitespace" = "error"
"no-loss-of-precision" = "error"
"no-misleading-character-class" = "error"
"no-nonoctal-decimal-escape" = "error"
"no-regex-spaces" = "error"
"no-self-assign" = "error"
"no-shadow-restricted-names" = "error"
"no-sparse-arrays" = "error"
"no-unexpected-multiline" = "error"
"no-unsafe-finally" = "error"
"no-unsafe-optional-chaining" = "error"
"no-unused-expressions" = "error"
"no-unused-labels" = "error"
"no-unused-private-class-members" = "error"
"no-unused-vars" = [
  "error",
  { "argsIgnorePattern" = "^_", "varsIgnorePattern" = "^_" },
]
"no-useless-backreference" = "error"
"no-useless-catch" = "error"
"no-useless-escape" = "error"
"no-var" = "error"
"oxc/no-accumulating-spread" = "error"
"prefer-const" = "error"
"prefer-rest-params" = "error"
"prefer-spread" = "error"
"quality/no-array-filter-existence" = "error"
"quality/no-array-filter-map" = "error"
"quality/no-array-sort-first" = "error"
"quality/no-catch-variable-type-assertion" = "error"
"quality/no-chained-type-assertions" = "error"
"quality/no-conditional-empty-object-spread" = "error"
"quality/no-dynamic-import" = "error"
"quality/no-environment-access" = "error"
"quality/no-json-parse-type-assertion" = "error"
"quality/no-known-value-widening" = "error"
"quality/no-module-mocking" = "error"
"quality/no-object-parameters" = "error"
"quality/no-reduce-accumulator-copy" = "error"
"quality/no-reexport-only-modules" = "error"
"quality/no-reflect-apply" = "error"
"quality/no-reflect-get" = "error"
"quality/no-runtime-typeof" = "error"
"quality/no-shape-in-symbol-names" = "error"
"quality/no-unknown-parameters" = "error"
"quality/no-unknown-returns" = "error"
"quality/no-unknown-type-aliases" = "error"
"quality/no-unsafe-dictionary-type" = "error"
"quality/no-widen-then-assert" = "error"
"quality/prefer-arrow-for-anonymous-functions" = "error"
"quality/require-safety-comment-for-type-assertion" = "error"
"quality/require-specific-suppression" = "error"
"require-await" = "error"
"require-yield" = "error"
"stylistic/require-readable-spacing" = "error"
"typescript/adjacent-overload-signatures" = "error"
"typescript/array-type" = "error"
"typescript/await-thenable" = "error"
"typescript/ban-ts-comment" = "error"
"typescript/ban-tslint-comment" = "error"
"typescript/consistent-generic-constructors" = "error"
"typescript/consistent-indexed-object-style" = "error"
"typescript/consistent-type-definitions" = "error"
"typescript/no-meaningless-void-operator" = "error"
"typescript/no-unnecessary-parameter-property-assignment" = "error"
"typescript/no-useless-default-assignment" = "error"
"typescript/no-useless-empty-export" = "error"
"typescript/require-array-sort-compare" = "error"
"typescript/restrict-template-expressions" = "error"
"typescript/unbound-method" = "error"
"use-isnan" = "error"
"valid-typeof" = "error"
"typescript/consistent-type-imports" = [
  "warn",
  { "prefer" = "type-imports", "fixStyle" = "separate-type-imports" },
]
"typescript/no-array-delete" = "error"
"typescript/no-base-to-string" = "error"
"typescript/no-confusing-non-null-assertion" = "error"
"typescript/no-duplicate-enum-values" = "error"
"typescript/no-duplicate-type-constituents" = "error"
"typescript/no-empty-object-type" = "error"
"typescript/no-explicit-any" = "error"
"typescript/no-floating-promises" = "error"
"typescript/no-extra-non-null-assertion" = "error"
"typescript/no-for-in-array" = "error"
"typescript/no-implied-eval" = "error"
"typescript/no-inferrable-types" = "error"
"typescript/no-misused-new" = "error"
"typescript/no-misused-spread" = "error"
"typescript/no-misused-promises" = [
  "error",
  { "checksVoidReturn" = { "attributes" = false } },
]
"typescript/no-namespace" = "error"
"typescript/no-non-null-asserted-optional-chain" = "error"
"typescript/no-redundant-type-constituents" = "error"
"typescript/no-require-imports" = "error"
"typescript/no-this-alias" = "error"
"typescript/no-unnecessary-type-assertion" = "error"
"typescript/no-unnecessary-type-constraint" = "error"
"typescript/no-unsafe-argument" = "error"
"typescript/no-unsafe-assignment" = "error"
"typescript/no-unsafe-call" = "error"
"typescript/no-unsafe-declaration-merging" = "error"
"typescript/no-unsafe-enum-comparison" = "error"
"typescript/no-unsafe-function-type" = "error"
"typescript/no-unsafe-member-access" = "error"
"typescript/no-unsafe-return" = "error"
"typescript/no-unsafe-type-assertion" = "error"
"typescript/no-unsafe-unary-minus" = "error"
"typescript/no-wrapper-object-types" = "error"
"typescript/non-nullable-type-assertion-style" = "error"
